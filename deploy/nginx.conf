# Nginx configuration for TutorGali
# Copy to: /etc/nginx/sites-available/tutorgali
# Then: sudo ln -s /etc/nginx/sites-available/tutorgali /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name YOUR_SERVER_IP;   # ← replace with your server's IP or domain

    # Max upload size (for certificate/ID proof uploads)
    client_max_body_size 10M;

    # Static files — served directly by Nginx (fast, no Django overhead)
    location /static/ {
        alias /home/ubuntu/tutorgali/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files — user uploads (certificates, ID proofs)
    location /media/ {
        alias /home/ubuntu/tutorgali/media/;
        expires 7d;
    }

    # Everything else → Gunicorn via Unix socket
    location / {
        proxy_pass         http://unix:/run/tutorgali.sock;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Security headers
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         DENY;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";
}
