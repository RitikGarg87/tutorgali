<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="TutorGali logo">
  <defs>
    <linearGradient id="tg-badge-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="tg-badge-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#f5b731"/>
    </linearGradient>
  </defs>

  <!-- Outer ring accent -->
  <circle cx="50" cy="50" r="49" fill="url(#tg-badge-ring)"/>

  <!-- Main badge circle -->
  <circle cx="50" cy="50" r="44" fill="url(#tg-badge-gradient)"/>

  <!-- Graduation cap -->
  <g transform="translate(50,38)">
    <path d="M0 -14 L28 -3 L0 8 L-28 -3 Z" fill="#ffffff"/>
    <path d="M-16 2 L-16 12 C-16 17 -8 19 0 19 C8 19 16 17 16 12 L16 2 L0 9 Z" fill="#ffffff" opacity="0.92"/>
    <rect x="24" y="-5" width="3" height="15" rx="1.5" fill="#f5b731"/>
    <circle cx="25.5" cy="11.5" r="3" fill="#f5b731"/>
  </g>

  <!-- Open book base -->
  <g transform="translate(50,68)">
    <path d="M-26 -3 C-18 -8 -8 -8 0 -3 C8 -8 18 -8 26 -3 L26 8 C18 3 8 3 0 8 C-8 3 -18 3 -26 8 Z" fill="#ffffff"/>
    <line x1="0" y1="-3" x2="0" y2="8" stroke="#1e3a8a" stroke-width="1.5"/>
  </g>
</svg>
