<form method="post" action="{% url 'create_booking_request' tutor.id %}"
      style="display:flex; flex-direction:column; gap:10px;">
  {% csrf_token %}

  <style>
    .bf-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 3px;
      display: block;
    }
    .bf-select, .bf-textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text-primary);
      background: var(--bg-input);
      transition: var(--transition);
    }
    .bf-select:focus, .bf-textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }
    .bf-textarea { resize: vertical; min-height: 72px; }
    .bf-submit {
      width: 100%;
      padding: 11px;
      background: var(--gradient);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
    }
    .bf-submit:hover { opacity: 0.9; transform: translateY(-1px); }
  </style>

  <!-- Grade -->
  <div>
    <label class="bf-label"><i class="fas fa-layer-group"></i> Grade</label>
    <select name="grade" class="bf-select">
      <option value="">Select Grade</option>
      <option value="nursery_to_5">Nursery to 5th</option>
      <option value="grade_6">6th Grade</option>
      <option value="grade_7">7th Grade</option>
      <option value="grade_8">8th Grade</option>
      <option value="grade_9">9th Grade</option>
      <option value="grade_10">10th Grade</option>
      <option value="grade_11">11th Grade</option>
      <option value="grade_12">12th Grade</option>
    </select>
  </div>

  <!-- Subject -->
  <div>
    <label class="bf-label"><i class="fas fa-book"></i> Subject</label>
    <input type="text" name="subject" class="bf-select"
           placeholder="e.g. Mathematics, Science">
  </div>

  <!-- Time Slot -->
  <div>
    <label class="bf-label"><i class="fas fa-clock"></i> Preferred Time Slot</label>
    <select name="time_slot" class="bf-select">
      <option value="">Select Time Slot</option>
      <option value="04:00-05:00">04:00 AM – 05:00 AM</option>
      <option value="05:00-06:00">05:00 AM – 06:00 AM</option>
      <option value="06:00-07:00">06:00 AM – 07:00 AM</option>
      <option value="07:00-08:00">07:00 AM – 08:00 AM</option>
      <option value="08:00-09:00">08:00 AM – 09:00 AM</option>
      <option value="09:00-10:00">09:00 AM – 10:00 AM</option>
      <option value="10:00-11:00">10:00 AM – 11:00 AM</option>
      <option value="11:00-12:00">11:00 AM – 12:00 PM</option>
      <option value="12:00-13:00">12:00 PM – 01:00 PM</option>
      <option value="13:00-14:00">01:00 PM – 02:00 PM</option>
      <option value="14:00-15:00">02:00 PM – 03:00 PM</option>
      <option value="15:00-16:00">03:00 PM – 04:00 PM</option>
      <option value="16:00-17:00">04:00 PM – 05:00 PM</option>
      <option value="17:00-18:00">05:00 PM – 06:00 PM</option>
      <option value="18:00-19:00">06:00 PM – 07:00 PM</option>
      <option value="19:00-20:00">07:00 PM – 08:00 PM</option>
      <option value="20:00-21:00">08:00 PM – 09:00 PM</option>
    </select>
  </div>

  <!-- Message -->
  <div>
    <label class="bf-label"><i class="fas fa-comment"></i> Message (optional)</label>
    <textarea name="message" class="bf-textarea"
              placeholder="Tell the tutor about your requirement, preferred schedule, etc."></textarea>
  </div>

  <button type="submit" class="bf-submit">
    <i class="fas fa-paper-plane"></i> Send Booking Request
  </button>
</form>
