{% extends 'users/base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        
        <div class="auth-header">
            <h2>Password Reset Successful!</h2>
            <p>Your password has been set. You can now login with your new password.</p>
        </div>

        <a href="{% url 'login' %}" class="btn btn-primary btn-block">
            <i class="fas fa-sign-in-alt"></i> Go to Login
        </a>
    </div>
</div>

<style>
    .auth-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .auth-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        max-width: 450px;
        width: 100%;
        padding: 2rem;
        text-align: center;
    }
    
    .success-icon {
        margin-bottom: 1.5rem;
    }
    
    .success-icon i {
        font-size: 5rem;
        color: #10b981;
        animation: scaleIn 0.5s ease-out;
    }
    
    @keyframes scaleIn {
        from {
            transform: scale(0);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }
    
    .auth-header {
        margin-bottom: 2rem;
    }
    
    .auth-header h2 {
        color: var(--primary-color);
        margin-bottom: 0.5rem;
    }
    
    .auth-header p {
        color: #666;
        font-size: 1rem;
    }
    
    .btn-block {
        width: 100%;
        padding: 1rem;
        font-size: 1rem;
        font-weight: 600;
        text-align: center;
        display: block;
    }
</style>
{% endblock %}
