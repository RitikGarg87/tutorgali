{% extends 'users/base.html' %}
{% block title %}Password Reset Complete — TutorGali{% endblock %}

{% block extra_css %}
<style>
  .auth-center { min-height: calc(100vh - 68px); display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .auth-box { width: 100%; max-width: 440px; }
  @keyframes scaleIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .success-anim { animation: scaleIn 0.5s ease-out; }
</style>
{% endblock %}

{% block content %}
<div class="auth-center">
  <div class="auth-box">
    <div class="card" style="text-align:center; padding:40px 32px;">
      <i class="fas fa-check-circle success-anim" style="font-size:4rem; color:var(--success); margin-bottom:20px; display:block;"></i>
      <h2 style="font-size:1.5rem; font-weight:800; margin-bottom:8px;">Password Reset Successful!</h2>
      <p style="color:var(--text-secondary); margin-bottom:28px;">Your password has been updated. You can now login with your new password.</p>
      <a href="{% url 'login' %}" class="btn btn-primary btn-full btn-lg">
        <i class="fas fa-sign-in-alt"></i> Go to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
